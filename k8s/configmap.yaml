apiVersion: v1
kind: ConfigMap
metadata:
  name: hkare-config
  namespace: hkare
data:
  # Database Configuration
  MYSQL_DATABASE: "hkare"
  MYSQL_USER: "hkare_user"
  
  # Application Configuration
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8082"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  
  # JPA Configuration
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.MySQLDialect"
  
  # CORS Configuration
  SPRING_WEB_CORS_ALLOWED_ORIGINS: "*"
  SPRING_WEB_CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  SPRING_WEB_CORS_ALLOWED_HEADERS: "*"
  SPRING_WEB_CORS_ALLOW_CREDENTIALS: "true"
  
  # Logging
  LOG_LEVEL: "INFO"

