---
- name: Create docker-compose directory
  file:
    path: "{{ docker_compose_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  tags: deploy

- name: Copy docker-compose.prod.yml
  template:
    src: ../docker-compose.prod.yml.j2
    dest: "{{ docker_compose_dir }}/docker-compose.yml"
    mode: '0644'
  tags: deploy

- name: Create .env file
  template:
    src: env.j2
    dest: "{{ docker_compose_dir }}/.env"
    mode: '0600'
  tags: deploy

- name: Pull latest Docker images
  command: docker-compose -f {{ docker_compose_dir }}/docker-compose.yml pull
  args:
    chdir: "{{ docker_compose_dir }}"
  tags: deploy

- name: Stop existing containers
  command: docker-compose -f {{ docker_compose_dir }}/docker-compose.yml down
  args:
    chdir: "{{ docker_compose_dir }}"
  ignore_errors: yes
  tags: deploy

- name: Start application containers
  command: docker-compose -f {{ docker_compose_dir }}/docker-compose.yml up -d
  args:
    chdir: "{{ docker_compose_dir }}"
  tags: deploy

- name: Wait for services to be healthy
  wait_for:
    port: "{{ item.port }}"
    host: "{{ item.host }}"
    delay: 10
    timeout: 60
  loop:
    - { port: "{{ mysql_port }}", host: "localhost" }
    - { port: "{{ backend_port }}", host: "localhost" }
    - { port: "{{ frontend_port }}", host: "localhost" }
  tags: deploy

- name: Show running containers
  command: docker-compose -f {{ docker_compose_dir }}/docker-compose.yml ps
  args:
    chdir: "{{ docker_compose_dir }}"
  register: container_status
  changed_when: false
  tags: deploy

- name: Display container status
  debug:
    var: container_status.stdout_lines
  tags: deploy

