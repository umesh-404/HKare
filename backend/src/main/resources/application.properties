spring.application.name=hkare-backend

# Server configuration
server.port=8080
# Remove context-path to serve directly from root
# server.servlet.context-path=/api

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hkare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging configuration
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.hkare.hkare_backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# CORS configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# Disable test-related features
spring.test.database.replace=none
spring.main.allow-bean-definition-overriding=true

# Spring MVC
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
spring.mvc.static-path-pattern=/static/**

# Disable Spring Boot Whitelabel Error Page
server.error.whitelabel.enabled=false

# Custom error handling - but don't throw exceptions for no handler
# spring.mvc.throw-exception-if-no-handler-found=true
# spring.web.resources.add-mappings=true
